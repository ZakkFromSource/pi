schema_version: 1.0.0
stack_version: 2.0.0

contracts:
  shared_policy: 1.0.0
  work_envelope: 1.0.0
  evidence_entry: 1.0.0
  routing_fixture: 1.0.0
  end_to_end_fixture: 1.0.0

route_signals:
  - name: scope-changed
    description: The agreed work scope or action reach changed materially.
  - name: evidence-stale
    description: Previously collected evidence no longer supports the next claim.
  - name: security-impact
    description: Work discovered or changed a trust boundary or security-sensitive surface.
  - name: documentation-impact
    description: Durable behavior, interfaces, configuration, or operator expectations changed.
  - name: refinement-debt
    description: Concrete readability or structure debt remains after behavior is proven.
  - name: reproducibility-impact
    description: Durable project setup knowledge is missing, changed, stale, or ready for automation.

